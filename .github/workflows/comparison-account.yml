name: Prepare the comparison test account

# Hands back the two values needed to point a local site at the TEST project and enable
# provider comparison for exactly one account: the project's anon key, and a user id.
#
# WHY IT RUNS HERE. Both need the Management API, which answers the access token this repo
# already holds and will not answer a sandboxed session. Nothing is stored, nothing is added
# to the repo, and this workflow writes no secret of its own.
#
# THE ANON KEY IS PRINTED, DELIBERATELY. It is a public value — production's is a repo
# VARIABLE baked into every deployed bundle a browser downloads. RLS is the boundary, not
# the key's secrecy. The service-role key is never fetched here and never should be.
#
# TEST ONLY, AND THERE IS NO PROJECT INPUT. An account minted on production would be a
# real-looking row in front of real players, and the comparison allow-list has no business
# naming a production user — confining the experiment to test is the whole point of it.
on:
  workflow_dispatch:
    inputs:
      email:
        description: Email for the test account (blank = just print the anon key)
        required: false
        default: ''
        type: string
      password:
        description: >-
          Password for it. RECORDED IN THIS RUN'S LOG IN PLAINTEXT - use a throwaway you use
          nowhere else. Ignored when email is blank.
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  PROJECT_REF: vgjehmwcpavflbfhbbrp

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Fail early if the token is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi

      - name: Read the test project's anon key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ANON=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          if [ -z "$ANON" ] || [ "$ANON" = "null" ]; then
            echo "::error::Could not read the anon key."
            exit 1
          fi
          echo "ANON=$ANON" >> "$GITHUB_ENV"
          {
            echo "## .env.local"
            echo
            echo "Put this in the repo root. It is gitignored."
            echo
            echo '```'
            echo "NEXT_PUBLIC_SUPABASE_URL=https://$PROJECT_REF.supabase.co"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the account and report its user id
        if: inputs.email != ''
        env:
          EMAIL: ${{ inputs.email }}
          PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail
          if [ -z "$PASSWORD" ]; then
            echo "::error::A password is required when an email is given."
            exit 1
          fi

          # `/auth/v1/signup` under the anon key: the same call the app's own form makes, so
          # this is an ordinary account rather than an admin-minted one. Email confirmation
          # is off on this project, so the user comes straight back — if that ever changes,
          # e2e/supabase.e2e.test.ts carries the remedy in its own failure message.
          BODY=$(jq -nc --arg e "$EMAIL" --arg p "$PASSWORD" '{email: $e, password: $p}' \
            | curl -sS "https://$PROJECT_REF.supabase.co/auth/v1/signup" \
                -H "apikey: $ANON" -H "Content-Type: application/json" --data @-)

          # A fresh signup answers with the user at the top level; some responses nest it.
          USER_ID=$(printf '%s' "$BODY" | jq -r '.id // .user.id // empty')

          if [ -z "$USER_ID" ]; then
            # The body carries the reason worth reading — already registered, weak password,
            # signups disabled. It holds no key, so echoing it is safe and is the only way to
            # tell those apart from here.
            echo "::error::No user id came back. Response: $BODY"
            exit 1
          fi

          {
            echo
            echo "## IDENTIFICATION_COMPARISON_USER_IDS"
            echo
            echo '```'
            echo "$USER_ID"
            echo '```'
            echo
            echo "Paste that into the secret of the same name, on the **test** project only."
            echo
            echo "Expected digest once saved:"
            echo '```'
            printf '%s' "$USER_ID" | sha256sum | cut -d' ' -f1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
