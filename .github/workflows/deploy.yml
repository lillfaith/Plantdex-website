name: Deploy to GitHub Pages

# The site is a fully static export, so Pages can serve it directly. Every push to the
# default branch rebuilds and redeploys; workflow_dispatch allows a manual re-run.
on:
  push:
    branches: [claude/planning-session-61zwro]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, types and tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build static export
        # GITHUB_PAGES switches on the /Plantdex-website basePath. Without it the site
        # would build for a domain root and every asset would 404 under the project path.
        #
        # The two NEXT_PUBLIC_SUPABASE_* values are meant to be public (see
        # src/lib/supabase-client.ts and .env.example) — set as repo *variables*, not
        # secrets, in Settings -> Secrets and variables -> Actions -> Variables. Left unset,
        # the build still succeeds and accounts simply report as "not configured" (see
        # src/app/account/page.tsx) rather than failing.
        #
        # NEXT_PUBLIC_PLAUSIBLE_DOMAIN is the site name registered with Plausible, and is the
        # single switch for analytics: unset, no script is loaded and no event is sent (see
        # src/lib/analytics.ts). It is a variable rather than a secret for the same reason as
        # the Supabase pair — it is a public identifier that ships in the HTML.
        #
        # The two commerce values are the Stripe Payment Link and the price string to print.
        # Both must be set for /shop to offer a buy button; with either missing the page says
        # the deck is not on sale rather than inventing a price. A Payment Link is a shareable
        # URL carrying no secret — a Stripe API KEY must never be added here, and none is
        # needed, which is the whole reason Payment Links were chosen.
        #
        # SITE_DOMAIN is the custom-domain switch and is normally UNSET, which reproduces
        # today's build exactly: the /Plantdex-website base path, and no CNAME. Setting it to
        # a bare hostname (no scheme, no trailing slash) drops the base path and makes the
        # step below write the CNAME. Read `docs/custom-domain.md` BEFORE setting it — the
        # DNS records and the Supabase redirect allow-list have to be in place first, and the
        # allow-list is the one that fails silently, taking password reset and signup
        # confirmation down while every page still loads.
        env:
          GITHUB_PAGES: 'true'
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
          NEXT_PUBLIC_STRIPE_PAYMENT_LINK: ${{ vars.NEXT_PUBLIC_STRIPE_PAYMENT_LINK }}
          NEXT_PUBLIC_DECK_PRICE: ${{ vars.NEXT_PUBLIC_DECK_PRICE }}
        run: npm run build

      # THE CNAME IS WRITTEN HERE, NOT COMMITTED TO public/.
      #
      # GitHub Pages reads this file out of the published artifact and treats it as the
      # site's custom domain. A committed one would therefore take effect on the very next
      # deploy — before any DNS existed — and Pages would begin redirecting the working
      # github.io URL to a hostname that does not resolve. That is a full outage caused by
      # adding a file, so the file only ever exists when the variable does.
      #
      # It must land in `out/` rather than `public/`, because `next build` has already run
      # and would not copy it. Writing it after the build is also what keeps the two halves
      # of the switch on one variable: the same SITE_DOMAIN that dropped the base path above.
      - name: Write CNAME for the custom domain
        if: vars.SITE_DOMAIN != ''
        run: echo -n "${{ vars.SITE_DOMAIN }}" > out/CNAME

      # Pages must be switched on once by a repo admin:
      #   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      # `enablement: true` is deliberately NOT set here: the Actions token is not allowed
      # to create a Pages site, and asking it to only produces a confusing
      # "Resource not accessible by integration" error instead of a clear one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
