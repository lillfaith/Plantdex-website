name: Deploy to GitHub Pages

# The site is a fully static export, so Pages can serve it directly. Every push to the
# default branch rebuilds and redeploys; workflow_dispatch allows a manual re-run.
on:
  push:
    branches: [claude/planning-session-61zwro]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, types and tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build static export
        # GITHUB_PAGES switches on the /Plantdex-website basePath. Without it the site
        # would build for a domain root and every asset would 404 under the project path.
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on automatically where the token permits, so this does not need a
          # manual visit to repo settings.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
