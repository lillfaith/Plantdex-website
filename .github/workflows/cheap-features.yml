name: Cheap features (can a pre-filter predict the full screening?)
# PRIVATE RESEARCH TOOL. Reads committed v4.1 results and the public iNaturalist API. Changes nothing. STARTED BY PUSHING evidence/blind-test/cheap-request.json.
on:
  push:
    branches: [claude/production-system-v1]
    paths: [evidence/blind-test/cheap-request.json]
permissions:
  contents: write
jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        card: [62, 63, 64, 65, 66]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow numpy opencv-python-headless pymupdf
      - run: |
          KIND=white; if [ "${{ matrix.card }}" = "65" ]; then KIND=yellow; fi
          python3 scripts/production/cheap_features.py --result evidence/blind-test/retro/${{ matrix.card }}_v4.1/result.json --card ${{ matrix.card }} --kind $KIND --out out
      - uses: actions/upload-artifact@v4
        with:
          name: cheap-${{ matrix.card }}
          path: out
          retention-days: 14
  report:
    needs: features
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cheap-*
          path: out
          merge-multiple: true
      - run: |
          mkdir -p evidence/blind-test/cheap && cp out/*.json evidence/blind-test/cheap/
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add evidence/blind-test/cheap; git commit -m "Cheap features for pre-filter study (research only)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true; git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done; exit 1
