name: Live confirm_scan checks (TEST project only)

# Runs e2e/scans-confirm.e2e.test.ts against the TEST Supabase project and nothing else: authorization,
# idempotency, refusal, real parallel confirmations, anon refused, and the missing-function code.
#
# WHY A WORKFLOW AND NOT A LOCAL RUN. The suite signs up its own disposable accounts with the project's PUBLIC key, kept as
# the repository VARIABLE TEST_SUPABASE_ANON_KEY (a variable, not a secret; legacy anon JWT or sb_publishable_ both work). This
# job reads NO secret. A step refuses a secret/service-role key or one from another project, and the key must work against the
# TEST project's own auth endpoint. The TEST project needs "Confirm email" OFF so the disposable accounts can sign in.
#
# TEST ONLY, ENFORCED. The project ref is a literal with no input and a guard step fails if it is ever anything but the test
# project. Dispatched by the owner. Agents never dispatch it and never edit it. It does not deploy, migrate or change a flag:
# NEXT_PUBLIC_CONFIRM_SCAN_RPC is not set here.
#
# HISTORY. `workflow_dispatch` only lists a workflow whose file is on the default (production) branch, so this file briefly
# carried a narrow `push` trigger (branch integration, this file only) to run once on merge. The live checks ran and passed
# (14 of 14, TEST project, run 45686940150) and the trigger is removed. It is now manual-dispatch only: it becomes
# runnable from the Actions tab when this file reaches the production branch in a normal release.
# `live-confirm-scan-e2e-guard.test.ts` still pins the TEST-only properties.
on:
  workflow_dispatch:

concurrency:
  group: live-confirm-scan
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: vgjehmwcpavflbfhbbrp

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse to run against anything but the test project
        run: |
          set -euo pipefail
          if [ "$PROJECT_REF" != "vgjehmwcpavflbfhbbrp" ]; then
            echo "::error::This workflow is for the TEST project only."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run the live confirm_scan checks
        env:
          # A repository VARIABLE, not a secret: the anon key is public by design (it ships in every client
          # bundle; Row Level Security is the boundary). This job therefore holds NO secret at all.
          TEST_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TEST_ANON_KEY" ]; then
            echo "::error::Repository variable TEST_SUPABASE_ANON_KEY is not set (Settings > Secrets and variables > Actions > Variables). It is the TEST project's public anon key."
            exit 1
          fi
          # Two key formats exist and either is public by design: the legacy JWT anon key (eyJ...), and the newer
          # publishable key (sb_publishable_...), which is NOT a JWT and cannot be decoded. A secret or service-role
          # key is refused outright. Whatever the format, the key must WORK against the TEST project's own auth
          # endpoint (a key from any other project is rejected there), so format never decides the project.
          case "$TEST_ANON_KEY" in
            sb_secret_*) echo "::error::TEST_SUPABASE_ANON_KEY holds a SECRET key. Use the public anon or publishable key. Refusing to run."; exit 1 ;;
            sb_publishable_*) echo "Key format: publishable." ;;
            eyJ*)
              python3 - <<'PY'
          import base64, json, os, sys
          key = os.environ["TEST_ANON_KEY"]
          try:
              seg = key.split(".")[1]
              payload = json.loads(base64.urlsafe_b64decode(seg + "=" * (-len(seg) % 4)))
          except Exception:
              sys.exit("::error::TEST_SUPABASE_ANON_KEY looks like a JWT but cannot be read.")
          if payload.get("role") != "anon":
              sys.exit("::error::The JWT key is not role anon (a service-role key must never be used here). Refusing to run.")
          if payload.get("ref") not in (None, "vgjehmwcpavflbfhbbrp"):
              sys.exit("::error::The JWT key names another project. Refusing to run.")
          print("Key format: legacy JWT anon key.")
          PY
              ;;
            *) echo "::error::TEST_SUPABASE_ANON_KEY is neither a publishable key nor a JWT anon key."; exit 1 ;;
          esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $TEST_ANON_KEY" \
            "https://$PROJECT_REF.supabase.co/auth/v1/settings")
          if [ "$code" != "200" ]; then
            echo "::error::The key was not accepted by the TEST project (HTTP $code). It belongs to another project or is wrong. Refusing to run."
            exit 1
          fi
          echo "The TEST project accepts this key."
          export NEXT_PUBLIC_SUPABASE_URL="https://$PROJECT_REF.supabase.co"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$TEST_ANON_KEY"
          set +e
          npx vitest run --config vitest.e2e.config.ts e2e/scans-confirm.e2e.test.ts --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/live.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ] && grep -q "Email not confirmed" "$RUNNER_TEMP/live.log"; then
            echo "::error::No test ran: the TEST project requires email confirmation, so the suite's disposable accounts cannot sign in. In the TEST project's dashboard turn OFF Authentication > Sign In / Providers > Email > Confirm email, then re-run. (The suite already documents this requirement.)"
          fi
          exit "$code"
