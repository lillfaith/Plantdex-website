name: Live confirm_scan checks (TEST project only)

# Runs e2e/scans-confirm.e2e.test.ts against the TEST Supabase project and nothing else: authorization,
# idempotency, refusal, real parallel confirmations, anon refused, and the missing-function code.
#
# WHY A WORKFLOW AND NOT A LOCAL RUN. Nothing here needs a secret the tests would hold: the suite signs up
# its own disposable accounts with the project's PUBLIC anon key, which this job reads at run time from
# the TEST-scoped access token already stored for the other TEST workflows and masks. The token is never
# passed to the tests, only to one curl. No service-role key exists in this job and none may be added.
# A local run would need the same anon key on a laptop, in a file, with no masking.
#
# TEST ONLY, ENFORCED. The project ref is a literal with no input, a guard step fails if it is ever anything
# but the test project, and the token is scoped to the test project so a production ref would answer 403
# even if the literal were edited. Dispatched by the owner. Agents never dispatch it and never edit it.
# It does not deploy, migrate or change a flag: NEXT_PUBLIC_CONFIRM_SCAN_RPC is not set here.
#
# TEMPORARY PUSH TRIGGER (remove in the follow-up PR). `workflow_dispatch` only lists a workflow whose file is on
# the default (production) branch, and we will not promote `integration` to production to make a test runnable.
# A push trigger runs the workflow file AS IT EXISTS ON THE PUSHED BRANCH, so merging this change into `integration`
# runs it once. It is deliberately narrow:
#   * branch `integration` only (a protected branch: nothing reaches it except a reviewed, checked, merged PR);
#   * only when THIS FILE changes (`paths`), so no other merge to integration ever runs it;
#   * a `push` event, never `pull_request_target`: it never runs code from a fork or an unmerged branch;
#   * read-only token, TEST project literal, no production credential, no deploy, no migration, no flag set.
# Removing the `push:` block in a second PR (which edits this file but, with the block gone, triggers nothing)
# returns it to manual-dispatch-only. `live-confirm-scan-e2e-guard.test.ts` pins every property above.
on:
  push:
    branches: [integration]
    paths:
      - .github/workflows/live-confirm-scan.yml
  workflow_dispatch:

concurrency:
  group: live-confirm-scan
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: vgjehmwcpavflbfhbbrp

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse to run against anything but the test project
        run: |
          set -euo pipefail
          if [ "$PROJECT_REF" != "vgjehmwcpavflbfhbbrp" ]; then
            echo "::error::This workflow is for the TEST project only."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run the live confirm_scan checks
        env:
          # A repository VARIABLE, not a secret: the anon key is public by design (it ships in every client
          # bundle; Row Level Security is the boundary). This job therefore holds NO secret at all.
          TEST_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TEST_ANON_KEY" ]; then
            echo "::error::Repository variable TEST_SUPABASE_ANON_KEY is not set (Settings > Secrets and variables > Actions > Variables). It is the TEST project's public anon key."
            exit 1
          fi
          # Refuse any key that is not THIS test project's: the anon key is a JWT whose payload names its project.
          python3 - <<'PY'
          import base64, json, os, sys
          key = os.environ["TEST_ANON_KEY"]
          try:
              payload = json.loads(base64.urlsafe_b64decode(key.split(".")[1] + "=" * (-len(key.split(".")[1]) % 4)))
          except Exception:
              sys.exit("::error::TEST_SUPABASE_ANON_KEY is not a Supabase JWT.")
          if payload.get("ref") != "vgjehmwcpavflbfhbbrp" or payload.get("role") != "anon":
              sys.exit("::error::TEST_SUPABASE_ANON_KEY is not the TEST project's anon key. Refusing to run.")
          print("Anon key belongs to the TEST project.")
          PY
          export NEXT_PUBLIC_SUPABASE_URL="https://$PROJECT_REF.supabase.co"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$TEST_ANON_KEY"
          npx vitest run --config vitest.e2e.config.ts e2e/scans-confirm.e2e.test.ts --reporter=verbose
