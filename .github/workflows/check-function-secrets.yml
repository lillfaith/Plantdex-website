name: Check the function secrets

# Answers "are the edge functions' project secrets actually set?" — a question nothing else
# in this repository could answer, because every one of them fails silently when missing
# (see scripts/check_function_secrets.py for what each one breaks).
#
# Read-only. It prints secret NAMES and a yes/no and never a value, so it is safe to run at
# any time and its log is safe to read. Runs on demand, and automatically before every
# function deploy, which is the moment the answer actually matters.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Which Supabase project to check
        required: true
        default: vygiamigomwlvnwkryyl
        type: choice
        options:
          - vygiamigomwlvnwkryyl # production — real players
          - vgjehmwcpavflbfhbbrp # test
          - both

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the token is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at" \
                 "https://supabase.com/dashboard/account/tokens and add it under" \
                 "Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi

      - name: Report which secrets are set
        # The response is piped straight into the script and never echoed: the endpoint
        # returns each secret's VALUE next to its name, and a workflow log is readable by
        # anyone with repo access. Same rule as check-auth-config.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CHOICE: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          if [ "$CHOICE" = "both" ]; then
            REFS="vgjehmwcpavflbfhbbrp vygiamigomwlvnwkryyl"
          else
            REFS="$CHOICE"
          fi
          failed=0
          for ref in $REFS; do
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$ref/secrets" \
              | python3 scripts/check_function_secrets.py "$ref" || failed=1
          done
          exit $failed
