name: Claude Code

# TEMPORARILY NARROWED (owner decision, 2026-11-19). The two pull-request REVIEW triggers (`pull_request_review_comment`
# and `pull_request_review`) are switched off, and the token now lives in the `claude-assistant` environment.
#
# WHY: an environment's branch rule is evaluated against the run's ref, and those two events run on
# `refs/pull/N/merge`, which no branch rule can name. Keeping them would have forced either an unrestricted environment
# (which protects nothing) or leaving CLAUDE_CODE_OAUTH_TOKEN as a repository-wide secret that ANY pushed workflow can read.
# `issue_comment` and `issues` run on the default branch, so they work with a branch-restricted environment. Note that
# `issue_comment` also fires for ordinary comments on a pull request's conversation tab, so `@claude` still works there;
# only inline review comments and review bodies stopped.
#
# TO RESTORE the original behaviour: the untouched original is docs/agent-workflow/github/archive/claude.yml.original.
# Do that only together with an environment that has a deployment-branch rule that can name pull-request refs, or after
# the token has been replaced by a narrower credential. See docs/agent-workflow/secrets-audit.md.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only the owner, members and collaborators can start it. On a public repository anyone can type "@claude"; the action
    # checks write access itself, but a strangers' comment should not even start a job that holds the token.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    environment: claude-assistant
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
