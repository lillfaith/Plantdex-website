name: Claude Code

# TEMPORARILY DISABLED (owner decision, 2026-11-20): automatic @claude and PR-review triggers are off while credentials are
# isolated. The original is preserved verbatim at docs/agent-workflow/github/archive/claude.yml.original; to restore, copy it
# back over this file. Only a manual run remains, and it can be started only by someone with write access, from the Actions tab.
# The CLAUDE_CODE_OAUTH_TOKEN secret is meant to be DELETED while this is disabled and re-created (ideally in an environment
# restricted to the production branch) when the triggers are restored.
on:
  workflow_dispatch:

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
