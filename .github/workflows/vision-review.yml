name: Vision review of photo candidates

# Runs the model-based review of the top photo candidates for one species and commits the
# verdicts. This is where the vision step BELONGS even once a key exists locally: every card
# in the catalogue is then graded by the same model version under the same rubric, and the
# key lives in one place rather than on anybody's laptop.
#
# REQUIRES the repository secret ANTHROPIC_API_KEY. Without it the job fails loudly rather
# than falling back, because a run that silently graded on colour thresholds and committed
# the result would be indistinguishable from a real one.
# A PUSH TRIGGER AS WELL, AND IT IS NOT A CONVENIENCE. GitHub will not dispatch a workflow
# it has never seen run, and it lists in the Actions "Run workflow" menu only what is on the
# DEFAULT branch -- which this repo's is not. So with workflow_dispatch alone this file was
# unrunnable by anybody, from the API (404) or from the UI, and the one step that most needs
# running was the one nothing could start. The paths are narrow: the vision scripts and this
# file. Until ANTHROPIC_API_KEY exists the run FAILS at the key check, loudly, by design --
# that failure is the guard working, not the workflow being broken.
on:
  push:
    branches: [claude/botanical-catalog-stage-1]
    paths:
      - scripts/vision_review.py
      - scripts/vision_agreement.py
      - .github/workflows/vision-review.yml
  workflow_dispatch:
    inputs:
      species:
        description: Species keys (space separated), as directories under evidence/candidates/
        required: true
        default: matricaria_chamomilla taraxacum_officinale verbascum_thapsus sambucus_canadensis pinus_strobus
        type: string
      limit:
        description: How many top candidates to review (each costs one call)
        required: true
        default: '3'
        type: string
      max_calls:
        description: Hard ceiling on model calls for this run
        required: true
        default: '5'
        type: string

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fail early if the key is missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it under Settings > Secrets and"
            echo "::error::variables > Actions. The vision step will NOT fall back here:"
            echo "::error::a committed verdict must say truthfully how it was produced."
            exit 1
          fi

      - name: Install
        run: pip install --quiet pillow numpy opencv-python-headless pymupdf

      - name: Self-test
        run: |
          python3 scripts/vision_review.py --self-test
          python3 scripts/vision_agreement.py --self-test
          python3 scripts/decisions.py --self-test

      # Each species gets its own --max-calls ceiling, so the run cannot spend the whole
      # budget on the first species and silently review the rest on the fallback.
      - name: Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for sp in ${{ inputs.species || 'matricaria_chamomilla taraxacum_officinale verbascum_thapsus sambucus_canadensis pinus_strobus' }}; do
            echo "::group::$sp"
            python3 scripts/vision_review.py \
              --species "$sp" \
              --limit "${{ inputs.limit || '4' }}" \
              --max-calls "${{ inputs.max_calls || '4' }}"
            echo "::endgroup::"
          done

      # THE POINT OF THE RUN. A verdict that agrees with every metric and disagrees with the
      # owner is not a working system. This scores the model's answers against the verdicts
      # he has already given, and reports agreement as UNDEFINED rather than 100% when no
      # genuine API verdict exists -- which is what it did before this secret was set.
      - name: Agreement with the owner's own verdicts
        run: python3 scripts/vision_agreement.py

      - name: Re-run the gates on the new verdicts
        run: python3 scripts/gates.py --species ${{ inputs.species || 'matricaria_chamomilla taraxacum_officinale verbascum_thapsus sambucus_canadensis pinus_strobus' }}

      - name: Rebuild the review sheet
        run: python3 scripts/contact_sheet.py

      # PUSH AFTER REBASING, AND RETRY. Run 7 of this workflow did all the work and then
      # threw it away: the branch had moved on while BiRefNet was segmenting, so the push
      # was a non-fast-forward and the verdicts would be lost with them. Two runs of this workflow
      # on one branch is the ordinary case, not the exception -- one per species.
      - name: Commit the verdicts and the cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/candidates evidence/vision-cache evidence/human-decisions.json
          # NOT `git diff --staged --quiet && exit 0`: the step runs under `bash -e`, the
          # diff returns 1 when there IS something to commit, and a failing `&&` chain as a
          # statement is exactly what -e kills the job for.
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Vision verdicts for ${{ inputs.species || 'the five review species' }}"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "push rejected; the branch moved. retrying in $((i * 5))s"
            sleep $((i * 5))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
