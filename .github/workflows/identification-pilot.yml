name: Run the identification pilot

# Runs the six-set accuracy pilot ENTIRELY INSIDE ACTIONS and uploads the raw JSONL and the
# scored report as artifacts.
#
# ── WHY IT RUNS HERE RATHER THAN ANYWHERE ELSE ───────────────────────────────────────────
#
# The benchmark needs two disposable TEST accounts to sign in as, and signing in needs their
# password. Every other place that password could live — a chat message, a developer's shell,
# a dispatch input, an artifact — is a place a credential has been copied to. Here it is a
# repository secret, read by the job that uses it, masked by Actions in anything it could
# reach, and it never leaves. That is the only reason this workflow exists: the harness runs
# perfectly well on a laptop, and a laptop is where the credential would then be.
#
# NOTHING SECRET IS EVER PRINTED. Not the password, not an access token, not the
# service-role key, not an Authorization header, not a signed-in request's body. The two
# helper scripts exist for exactly that: `test_account_id.py` extracts an id from a sign-in
# response and drops both tokens rather than letting `jq` near the body, and
# `check_pilot_preflight.py` compares digests and prints only names and verdicts. The anon
# key is masked on arrival even though it is a public value, because a masked value cannot
# be leaked by a later step that nobody re-read.
#
# ── TEST ONLY, ENFORCED RATHER THAN INTENDED ─────────────────────────────────────────────
#
# No input can name a Supabase project: the ref is a literal, and a guard below FAILS if that
# literal is ever anything but the test project or if it matches the production ref. The
# production project is read ONCE, read-only, to assert it does NOT carry the photograph
# floor — the only way to prove production was left alone is to look at it.
#
# ── THE BUDGET IS A CEILING, NOT A PREDICTION ────────────────────────────────────────────
#
#   6 sets x 4 conditions = 24 requests = 24 PlantNet identifications
#   1 condition per set (p3auto) runs as the comparison account = 6 Kindwise credits
#
# `MAX_REQUESTS` and `MAX_KINDWISE` are passed to the harness, which REFUSES TO SEND
# ANYTHING if the plan it computes exceeds them. They are separate from the plan on purpose:
# a manifest edit or a stray condition changes the plan silently, and an approved budget is a
# number somebody signed off rather than one recomputed from today's inputs. There are no
# retries anywhere in the harness, so nothing can re-spend a credit.
#
# ── THE FIRST SET IS A GATE ──────────────────────────────────────────────────────────────
#
# Three of the five checks are claims about what a REQUEST does, and none is answerable by
# reading configuration — "the comparison account costs a Kindwise credit" can only be
# established by spending one. A separate preflight would be a SEVENTH credit on a six-credit
# budget. So the first set's own four requests are the gate: nothing extra is sent, and a
# failure stops the run having spent ONE credit instead of six. See `verify_pilot_gate.py`.
on:
  workflow_dispatch:
    inputs:
      comparison_email:
        description: Email of the disposable account that IS allow-listed for comparison
        required: true
        type: string
      plain_email:
        description: Email of the disposable account that is NOT allow-listed
        required: true
        type: string
      confirm_spend:
        description: Typing SPEND confirms up to 6 Kindwise credits will be used
        required: true
        default: ''
        type: string

permissions:
  contents: read

env:
  PROJECT_REF: vgjehmwcpavflbfhbbrp
  PRODUCTION_REF: vygiamigomwlvnwkryyl
  MANIFEST: scripts/benchmark/sets.json
  CONDITIONS: p1,p2,p3auto,p3tag
  SIGNED_IN: p3auto
  MAX_REQUESTS: '24'
  MAX_KINDWISE: '6'
  GATE_SET: plantago-major
  REST_SETS: taraxacum-officinale,rumex-obtusifolius,viola-sororia,capsella-rubella,bellis-perennis

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run against anything but the test project
        # ENFORCED, NOT CONVENTIONAL. `PROJECT_REF` is a literal with no input feeding it, so
        # this can only fire if somebody edits that literal — exactly the change that must
        # not pass silently.
        run: |
          set -euo pipefail
          if [ "$PROJECT_REF" != "vgjehmwcpavflbfhbbrp" ]; then
            echo "::error::Hard-scoped to the TEST project. PROJECT_REF is '$PROJECT_REF'."
            exit 1
          fi
          if [ "$PROJECT_REF" = "$PRODUCTION_REF" ]; then
            echo "::error::PROJECT_REF is the PRODUCTION project. Refusing."
            exit 1
          fi
          echo "Scoped to TEST ($PROJECT_REF)."

      - name: Require an explicit spend confirmation
        env:
          CONFIRM: ${{ inputs.confirm_spend }}
        run: |
          if [ "$CONFIRM" != "SPEND" ]; then
            echo "::error::This run uses up to $MAX_KINDWISE paid Kindwise credits." \
                 "Type SPEND in confirm_spend to proceed. Nothing was sent."
            exit 1
          fi

      - name: Fail early if a required secret is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$TEST_ACCOUNT_PASSWORD" ] && missing="$missing TEST_ACCOUNT_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing"
            exit 1
          fi
          echo "Required secrets are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch the anon key, masked
        # Masked even though it is a public value — production's is a repo VARIABLE baked
        # into every deployed bundle. Masking costs nothing and removes a whole class of
        # "a later step echoed it" mistake.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ANON=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | python3 -c "import json,sys; print(next(k['api_key'] for k in json.load(sys.stdin) if k['name']=='anon'))")
          echo "::add-mask::$ANON"
          echo "ANON_KEY=$ANON" >> "$GITHUB_ENV"

      - name: Resolve both account ids, without printing a token
        # `test_account_id.py` signs in and emits ONLY `.user.id`. Both the access and
        # refresh token in that response are dropped inside the process and never reach a
        # log, a step output or an artifact.
        env:
          EMAIL_COMPARISON: ${{ inputs.comparison_email }}
          EMAIL_PLAIN: ${{ inputs.plain_email }}
          PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: |
          set -euo pipefail
          COMPARISON_ID=$(EMAIL="$EMAIL_COMPARISON" python3 scripts/test_account_id.py)
          PLAIN_ID=$(EMAIL="$EMAIL_PLAIN" python3 scripts/test_account_id.py)
          if [ "$COMPARISON_ID" = "$PLAIN_ID" ]; then
            echo "::error::Both emails resolved to the same account. The plain account must" \
                 "be a DIFFERENT user, or every request costs a Kindwise credit."
            exit 1
          fi
          echo "COMPARISON_ID=$COMPARISON_ID" >> "$GITHUB_ENV"
          echo "PLAIN_ID=$PLAIN_ID" >> "$GITHUB_ENV"
          echo "Resolved two distinct accounts."

      - name: 'Preflight 1 of 2: TEST is configured exactly as approved'
        # Checks 4 and 5 of the five, plus the configuration half of 1. Costs nothing.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
            | EXPECTED_COMPARISON_USER_ID="$COMPARISON_ID" \
              python3 scripts/check_pilot_preflight.py "$PROJECT_REF" test

      - name: 'Preflight 2 of 2: PRODUCTION has not been touched'
        # READ-ONLY, and the only place the production ref is used. The only way to prove
        # production was left alone is to look at it.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PRODUCTION_REF/secrets" \
            | python3 scripts/check_pilot_preflight.py "$PRODUCTION_REF" production

      - name: Show the budget without sending anything
        env:
          PILOT: '1'
          DRY_RUN: '1'
        run: python3 scripts/identify_web_images.py

      - run: python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: 'Gate: the first set only (4 requests, 1 credit)'
        env:
          PILOT: '1'
          ONLY: ${{ env.GATE_SET }}
          OUT: gate.jsonl
          USER_EMAIL: ${{ inputs.comparison_email }}
          USER_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          PLAIN_USER_EMAIL: ${{ inputs.plain_email }}
          PLAIN_USER_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          MAX_REQUESTS: '4'
          MAX_KINDWISE: '1'
        run: python3 scripts/identify_web_images.py

      - name: Read the gate's comparison rows back
        env:
          COMPARISONS: '1'
          OUT: gate.jsonl
          COMPARISONS_OUT: gate-comparisons.json
          USER_EMAIL: ${{ inputs.comparison_email }}
          USER_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: |
          # The insert is handed to `EdgeRuntime.waitUntil`, so a row lands shortly after its
          # response does. One settle, then read — no retry loop, because a retry here would
          # be indistinguishable from the row genuinely never being written.
          sleep 20
          python3 scripts/identify_web_images.py

      - name: 'Gate check: both providers, and only where they should be'
        # Checks 1, 2 and 3 of the five. A failure here stops the run at ONE credit.
        run: python3 scripts/verify_pilot_gate.py gate.jsonl gate-comparisons.json

      - name: 'The remaining five sets (20 requests, 5 credits)'
        env:
          PILOT: '1'
          ONLY: ${{ env.REST_SETS }}
          OUT: rest.jsonl
          USER_EMAIL: ${{ inputs.comparison_email }}
          USER_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          PLAIN_USER_EMAIL: ${{ inputs.plain_email }}
          PLAIN_USER_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          MAX_REQUESTS: '20'
          MAX_KINDWISE: '5'
        run: python3 scripts/identify_web_images.py

      - name: Combine, and read every comparison row back
        env:
          COMPARISONS: '1'
          OUT: benchmark-results.jsonl
          COMPARISONS_OUT: benchmark-comparisons.json
          USER_EMAIL: ${{ inputs.comparison_email }}
          USER_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: |
          set -euo pipefail
          cat gate.jsonl rest.jsonl > benchmark-results.jsonl
          sleep 20
          python3 scripts/identify_web_images.py

      - name: Assert what was actually spent
        # The ceiling is enforced before sending; this asserts what the RECORD says came
        # back, which is the number that goes in the report.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          rows = [json.loads(l) for l in open("benchmark-results.jsonl") if l.strip()]
          comparing = [r for r in rows if r.get("comparing")]
          print(f"requests recorded : {len(rows)}")
          print(f"comparison requests: {len(comparing)}  (= Kindwise credits)")
          assert len(rows) <= 24, f"{len(rows)} requests exceeds the approved 24"
          assert len(comparing) <= 6, f"{len(comparing)} credits exceeds the approved 6"
          print("Within the approved budget.")
          PY

      - run: npm ci

      - name: Score it with the real matcher
        # `| tee` so the report is both in the log and in the artifact. It reads only the
        # two data files; neither carries a credential.
        run: |
          set -euo pipefail
          npx vitest run --config vitest.bench.config.ts 2>&1 | tee pilot-report.txt

      - name: Prove the artifacts carry nothing secret
        # A benchmark record holds Commons filenames, provider names, scores and observation
        # uuids. None of that is a credential — but "none of that is a credential" is a claim
        # worth checking rather than asserting, because the files are about to be downloadable
        # by anyone with repo access.
        env:
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          for f in benchmark-results.jsonl benchmark-comparisons.json pilot-report.txt; do
            for needle in "$TEST_ACCOUNT_PASSWORD" "$SUPABASE_ACCESS_TOKEN" "$ANON_KEY"; do
              if [ -n "$needle" ] && grep -qF -- "$needle" "$f" 2>/dev/null; then
                echo "::error::$f contains a secret value. Not uploading."
                fail=1
              fi
            done
            # A JWT is three base64 segments; any of ours would start like this.
            if grep -qE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ' "$f" 2>/dev/null; then
              echo "::error::$f looks like it contains a JWT. Not uploading."
              fail=1
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: identification-pilot
          path: |
            benchmark-results.jsonl
            benchmark-comparisons.json
            pilot-report.txt
          retention-days: 30
