name: Run the field validation

# Puts the committed `field/` specimens through the deployed TEST identifier and uploads the
# raw JSONL and the scored report as artifacts.
#
# WHY IT RUNS HERE. Same reason as `identification-pilot.yml`: signing in needs the disposable
# accounts' password, and a repository secret read by the job that uses it is the only place
# that password is not copied to. The harness would run fine on a laptop; a laptop is then
# where the credential lives.
#
# PLANTNET ONLY, AND THE HARNESS ENFORCES IT. `run_field()` REFUSES a `SIGNED_IN` value
# outright, so no comparison request can be issued from this mode and no plant.id credit can
# be spent — the budget line prints `Kindwise credits 0` because zero is structural here, not
# a setting. This phase exists to test the PlantNet system that is about to ship.
#
# TEST ONLY, ENFORCED RATHER THAN INTENDED. No input can name a Supabase project, the ref is
# a literal, and the guard below fails if that literal is ever anything but the test project.
# Production is never contacted at all — not even read — because nothing here needs it.
#
# BUDGET: 3 conditions per specimen, so 8 phone specimens = 24 requests and 3 internet ones
# = 9. `MAX_REQUESTS` is passed to the harness, which REFUSES to send anything if the plan it
# computes exceeds it — a manifest edit changes the plan silently, and an approved budget is a
# number somebody signed off.
#
# TWO DATASETS, NEVER ONE FILE. `field/` is photographs taken on a phone; `field-inat/` is
# documented iNaturalist observations, which answer a different question and carry different
# evidence behind their ground truth. They run separately, write separate JSONL, and upload
# separate artifacts, because the moment they share a file the report averages a number over
# two kinds of picture and nobody can tell afterwards which half moved it.
on:
  workflow_dispatch:
    inputs:
      set:
        description: >-
          Which specimen set to run. `field` is the phone-collected set; `field-inat` is the
          documented-observation set. Never both — see the note above.
        required: true
        default: field
        type: choice
        options:
          - field
          - field-inat
      account_email:
        description: Disposable TEST account to sign in as (use the NON-allow-listed one)
        required: true
        type: string
      conditions:
        description: Which arms to run
        required: true
        default: p1,p2,p3auto
        type: string
      only:
        description: Comma-separated specimen ids, to resume a partial run. Blank = all.
        required: false
        default: ''
        type: string
      max_requests:
        description: >-
          Ceiling on PlantNet identifications. The harness refuses to send ANYTHING if its
          computed plan exceeds this, so it is an approved budget rather than a prediction.
        required: true
        default: '27'
        type: string

permissions:
  contents: read

env:
  PROJECT_REF: vgjehmwcpavflbfhbbrp
  PRODUCTION_REF: vygiamigomwlvnwkryyl
  # The dropdown already confines this to two values; it is composed here rather than taken
  # as a path so no input can ever name a file outside the two committed sets.
  FIELD: ${{ inputs.set }}/manifest.json
  OUT: ${{ inputs.set }}-results.jsonl
  REPORT: ${{ inputs.set }}-report.txt

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run against anything but the test project
        run: |
          set -euo pipefail
          if [ "$PROJECT_REF" != "vgjehmwcpavflbfhbbrp" ]; then
            echo "::error::Hard-scoped to TEST. PROJECT_REF is '$PROJECT_REF'."
            exit 1
          fi
          if [ "$PROJECT_REF" = "$PRODUCTION_REF" ]; then
            echo "::error::PROJECT_REF is the PRODUCTION project. Refusing."
            exit 1
          fi
          echo "Scoped to TEST ($PROJECT_REF)."

      - name: Fail early if a required secret is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$TEST_ACCOUNT_PASSWORD" ] && missing="$missing TEST_ACCOUNT_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Not set:$missing"; exit 1; fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch the anon key, masked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ANON=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | python3 -c "import json,sys; print(next(k['api_key'] for k in json.load(sys.stdin) if k['name']=='anon'))")
          echo "::add-mask::$ANON"
          echo "ANON_KEY=$ANON" >> "$GITHUB_ENV"

      - name: Show the budget without sending anything
        env:
          DRY_RUN: '1'
          CONDITIONS: ${{ inputs.conditions }}
          ONLY: ${{ inputs.only }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: python3 scripts/identify_web_images.py

      - run: python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: Identify every specimen
        env:
          CONDITIONS: ${{ inputs.conditions }}
          ONLY: ${{ inputs.only }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          USER_EMAIL: ${{ inputs.account_email }}
          USER_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
        run: python3 scripts/identify_web_images.py

      - name: Assert what was actually spent
        # The ceiling is enforced before sending; this asserts what the RECORD says came
        # back, against the SAME number the operator approved rather than a second literal.
        # A hardcoded 24 here would have refused the nine-specimen phase-2 set, which needs
        # 27 — a cap sized for a previous run is how a safety limit becomes an outage.
        env:
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          cap = int(os.environ["MAX_REQUESTS"])
          rows = [json.loads(l) for l in open(os.environ["OUT"]) if l.strip()]
          comparing = [r for r in rows if r.get("comparing")]
          print(f"requests recorded  : {len(rows)}  (approved ceiling {cap})")
          print(f"comparison requests: {len(comparing)}  (= Kindwise credits)")
          assert len(rows) <= cap, f"{len(rows)} requests exceeds the approved {cap}"
          assert not comparing, "a comparison request was made in a PlantNet-only phase"
          print("Within budget, and no plant.id credit was spent.")
          PY

      - run: npm ci

      - name: Score it with the real matcher
        env:
          BENCH_RESULTS: ${{ inputs.set }}-results.jsonl
        run: |
          set -euo pipefail
          npx vitest run --config vitest.bench.config.ts 2>&1 | tee "$REPORT"

      - name: Prove the artifacts carry nothing secret
        env:
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          fail=0
          for f in "$OUT" "$REPORT"; do
            for needle in "$TEST_ACCOUNT_PASSWORD" "$SUPABASE_ACCESS_TOKEN" "$ANON_KEY"; do
              if [ -n "$needle" ] && grep -qF -- "$needle" "$f" 2>/dev/null; then
                echo "::error::$f contains a secret value. Not uploading."; fail=1
              fi
            done
            if grep -qE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ' "$f" 2>/dev/null; then
              echo "::error::$f looks like it contains a JWT. Not uploading."; fail=1
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ inputs.set }}
          path: |
            ${{ inputs.set }}-results.jsonl
            ${{ inputs.set }}-report.txt
          retention-days: 30
