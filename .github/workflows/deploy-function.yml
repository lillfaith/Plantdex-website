name: Deploy Supabase edge function

# Deploying an edge function needs a Supabase access token, which does not belong on
# anybody's laptop or in a chat window — so it lives in this repo's Actions secrets and the
# deploy happens here. Run it from the Actions tab and pick a project and a function.
#
# THREE FUNCTIONS NOW. `herbdex-action` recomputes mastery and research server-side;
# `delete-account` erases an account, and until it is deployed the Delete button on
# /account reports a failure and deletes nothing. `identify-plant` runs Plant ID, and needs
# PLANTNET_API_KEY set as a project secret before it can do anything. Deploy ALL to any
# project where people have accounts — a live account whose deletion path is missing is the
# one state this workflow exists to prevent.
#
# ONE-TIME SETUP: create a token at https://supabase.com/dashboard/account/tokens and add it
# as a repository secret named SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables →
# Actions → Secrets). It is a real credential, unlike the anon key — a secret, not a
# variable.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Which Supabase project to deploy to
        required: true
        default: vgjehmwcpavflbfhbbrp
        type: choice
        options:
          - vgjehmwcpavflbfhbbrp # test — where npm run verify:supabase runs
          - vygiamigomwlvnwkryyl # production — real players
      function:
        description: Which function to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - herbdex-action
          - delete-account
          - identify-plant

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fail early if the token is missing
        # Without this the CLI fails somewhere inside a login prompt, which reads as a
        # broken workflow rather than a missing secret.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at" \
                 "https://supabase.com/dashboard/account/tokens and add it under" \
                 "Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi

      - run: npm ci

      - name: Regenerate the shared reducer copies
        # supabase/functions/_shared/herbdex/ is generated from src/lib. Deploying without
        # this step ships whatever was last committed there, which is how the function and
        # the app drift apart.
        run: npm run sync:edge-shared

      - name: Fail if the generated copies were out of date
        # `edge-shared.test.ts` asserts the same thing, but this catches a commit that
        # skipped the sync before it reaches a live project rather than after.
        run: |
          if ! git diff --quiet -- supabase/functions/_shared; then
            echo "::error::supabase/functions/_shared was out of date. Run" \
                 "'npm run sync:edge-shared' and commit the result."
            git --no-pager diff --stat -- supabase/functions/_shared
            exit 1
          fi

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CHOICE: ${{ inputs.function }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          if [ "$CHOICE" = "all" ]; then
            FUNCTIONS="herbdex-action delete-account identify-plant"
          else
            FUNCTIONS="$CHOICE"
          fi
          for fn in $FUNCTIONS; do
            echo "::group::Deploying $fn"
            npx --yes supabase@2 functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      - name: Check the CORS preflight answers
        # The failure this exists for is invisible everywhere else: with no OPTIONS handler
        # the browser blocks every call before it is sent, while Node-based tests still
        # pass because nothing enforces CORS there.
        #
        # Checked for every function deployed, not just the first: delete-account is called
        # from the browser exactly like herbdex-action is, and a missing preflight there
        # would make the Delete button fail in a way no test in this repo can see.
        env:
          CHOICE: ${{ inputs.function }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          if [ "$CHOICE" = "all" ]; then
            FUNCTIONS="herbdex-action delete-account identify-plant"
          else
            FUNCTIONS="$CHOICE"
          fi
          failed=0
          for fn in $FUNCTIONS; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
              "https://$PROJECT_REF.supabase.co/functions/v1/$fn" \
              -H 'Origin: https://example.com' \
              -H 'Access-Control-Request-Method: POST')
            echo "$fn: OPTIONS preflight -> $status"
            if [ "$status" != "204" ]; then
              echo "::error::$fn preflight answered $status, expected 204. Browsers will" \
                   "block every call to this function."
              failed=1
            fi
          done
          exit $failed
