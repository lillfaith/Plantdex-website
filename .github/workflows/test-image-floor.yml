name: Set the TEST photograph floor

# Sets — or clears — `IDENTIFY_MIN_IMAGES` on the TEST project, and only on the test project.
#
# WHY IT EXISTS. Requiring two photographs is a cost this product imposes on every player: a
# second tap and a second framing, in front of a plant. It was chosen from an argument rather
# than a measurement, and the measurement is impossible against a deployment that hard-codes
# the floor it is evaluating. So `scripts/identify_web_images.py`'s 1-photograph arm needs
# this variable set to `1` on the deployment being benchmarked.
#
# THERE IS NO PROJECT INPUT, AND THAT IS THE ENTIRE SAFETY ARGUMENT. `PROJECT_REF` is a
# literal below, so production is not reachable from this workflow at all — not by a wrong
# choice in a dropdown, not by a typo, not by a copied dispatch. Same shape and same reason as
# `comparison-account.yml`, which mints accounts on test and takes no project either. A
# production endpoint accepting a single image would be accepting requests its own UI never
# makes, which is why this is the one setting that must never be a choice.
#
# `1` is what the benchmark needs. `2` is the product's own rule and is offered so a floor can
# be pinned explicitly, and `unset` is the cleanup — `resolveMinImages` returns `MIN_IMAGES`
# for an absent variable, so unset and `2` behave identically and unset is the honest resting
# state. Nothing above `3` is offered: `MAX_IMAGES` is 3 and a floor above the ceiling would
# refuse every request that could ever be made (the resolver clamps it, but a dropdown should
# not invite it).
#
# ONE-TIME SETUP is the same SUPABASE_ACCESS_TOKEN every other workflow here uses.
#
# AFTERWARDS, run `check-function-secrets` against BOTH projects. It reports this variable by
# name, resolves its value, and FAILS if production is ever found holding it.
on:
  workflow_dispatch:
    inputs:
      value:
        description: The minimum number of photographs the TEST endpoint will accept
        required: true
        default: unset
        type: choice
        options:
          - unset # the product's own rule, and the resting state
          - '1' # the benchmark's 1-photograph arm
          - '2'
          - '3'

permissions:
  contents: read

env:
  # TEST. Deliberately not an input — see above.
  PROJECT_REF: vgjehmwcpavflbfhbbrp
  SECRET_NAME: IDENTIFY_MIN_IMAGES

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the token is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at" \
                 "https://supabase.com/dashboard/account/tokens and add it under" \
                 "Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi

      - name: Refuse a token that can reach production but not test
        # The same guard `deploy-function` carries. A token scoped to the wrong project
        # answers 403 on every call, which reads as a broken workflow rather than a token
        # that needs its resource access widened.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects > /tmp/projects.json
          if ! grep -q "\"$PROJECT_REF\"" /tmp/projects.json; then
            echo "::error::The token is valid but is NOT SCOPED TO $PROJECT_REF."
            exit 1
          fi
          echo "Token is scoped to $PROJECT_REF."

      - name: Apply it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VALUE: ${{ inputs.value }}
        run: |
          set -euo pipefail
          if [ "$VALUE" = "unset" ]; then
            # A 404 here means it was already absent, which is success for a clear.
            curl -sS -X DELETE \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
              --data "$(jq -nc --arg n "$SECRET_NAME" '[$n]')" > /dev/null
            echo "Cleared $SECRET_NAME on $PROJECT_REF. The floor is 2 again."
          else
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
              --data "$(jq -nc --arg n "$SECRET_NAME" --arg v "$VALUE" '[{name: $n, value: $v}]')" \
              > /dev/null
            echo "Set $SECRET_NAME=$VALUE on $PROJECT_REF."
          fi

      - name: Read it back, and prove production was not touched
        # A write nobody verified is a write somebody will assume happened. This reads BOTH
        # projects through the ordinary read-only checker, which names this variable, resolves
        # its value, and exits non-zero if production is holding it.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          failed=0
          for ref in vgjehmwcpavflbfhbbrp vygiamigomwlvnwkryyl; do
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$ref/secrets" \
              | python3 scripts/check_function_secrets.py "$ref" || failed=1
          done
          exit $failed

      - name: Say what still has to happen
        run: |
          {
            echo "## A secret change needs a redeploy"
            echo
            echo "Edge functions read their environment at boot, so \`$SECRET_NAME\` does not"
            echo "take effect until \`identify-plant\` is deployed again. Run"
            echo "**Deploy Supabase edge function** against \`$PROJECT_REF\`."
          } >> "$GITHUB_STEP_SUMMARY"
