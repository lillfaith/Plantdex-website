name: Boss Form live tests (TEST project only)

# Runs e2e/boss-form.e2e.test.ts and e2e/challenge-submit.e2e.test.ts against the TEST Supabase
# project with disposable accounts. It uses the project's PUBLIC anon key only (read through the
# management API inside the job, never printed) and never holds a service-role key.
#
# HARD-SCOPED: the project ref is a constant, not an input, and the job refuses to start if it is
# production. `e2e/guard.setup.ts` and each suite repeat the check.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_REF: vgjehmwcpavflbfhbbrp
  PRODUCTION_REF: vygiamigomwlvnwkryyl

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run against anything but the test project
        run: |
          set -euo pipefail
          if [ "$PROJECT_REF" != "vgjehmwcpavflbfhbbrp" ] || [ "$PROJECT_REF" = "$PRODUCTION_REF" ]; then
            echo "::error::This workflow is hard-scoped to the TEST project (got '$PROJECT_REF')."
            exit 1
          fi
          echo "Scoped to TEST ($PROJECT_REF)."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read the test project's anon key (public; not printed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ANON=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          if [ -z "$ANON" ] || [ "$ANON" = "null" ]; then
            echo "::error::Could not read the anon key."
            exit 1
          fi
          echo "::add-mask::$ANON"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$PROJECT_REF.supabase.co" >> "$GITHUB_ENV"

      - name: Boss Form live tests
        run: >
          npx vitest run --config vitest.e2e.config.ts
          e2e/boss-form.e2e.test.ts e2e/challenge-submit.e2e.test.ts
          --reporter=verbose
