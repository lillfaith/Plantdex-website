name: Live camera-to-collection run (TEST project only, autonomous)

# Runs e2e/capture-flow.e2e.test.ts against the TEST Supabase project with no human step in the middle:
#   1. PREFLIGHT   verifies the target, migration 0016, enforcement OFF, the deployed function, the provider + attestation
#                  secrets and the admin credential. Anything that cannot be verified FAILS; nothing is spent or changed.
#   2. LIVE        creates two already-confirmed disposable accounts (written to auth.users through the Database scope the token
#                  has, because the token is refused by the Auth admin / API-keys endpoints; the project's "Confirm email"
#                  setting is never touched), proves each can sign in through the real Auth endpoint, runs the suite against the DEPLOYED identify-plant and its REAL provider, writes a
#                  PASS/FAIL table and the evidence to the run summary, and deletes ONLY the accounts it created.
#
# WHAT SPENDS PROVIDER CREDITS: exactly two identifications per run (the card photograph, and one blank image to exercise the
# provider's no-plant answer). The replay spends none. The request file caps this at 2.
#
# HOW IT IS STARTED, AND WHY AN ORDINARY PUSH CANNOT START IT. The only trigger is a push to `integration` that CHANGES
# docs/release/live-run-request.json. Every run needs a new commit to that file, which must name the TEST project, say the owner
# authorised it, state enforcement OFF, cap the provider calls at 2, carry a fresh request id and an unexpired time. A re-run of
# the same run is refused (run_attempt must be 1), so a credit-spending run can never be repeated by pressing a button.
# THIS TRIGGER IS TEMPORARY: it is removed once the run it was added for has been reported.
#
# TEST ONLY, ENFORCED: the project ref is a literal with no input; scripts/live_run.py refuses any other ref; production is not
# named here. The only secret is SUPABASE_ACCESS_TOKEN, held by the preflight/provision/cleanup steps and NEVER by the step that
# runs the suite. No service-role key is obtained at all. The TEST anon key is the PUBLIC repository variable TEST_SUPABASE_ANON_KEY. It cannot change a flag: this workflow deploys nothing, migrates nothing and never calls
# set_discovery_enforcement.
# TRIGGER DISABLED after run 2 (2026-11-27). To authorise another credit-spending run, a reviewed PR restores the `push:` block that
# watches docs/release/live-run-request.json (see git history of this file). `workflow_dispatch` is kept only so the file stays a
# valid workflow; the gate step refuses anything that is not a push to integration, so a dispatch fails before spending anything.
on:
  workflow_dispatch:

concurrency:
  group: live-capture-run
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: vgjehmwcpavflbfhbbrp

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      herb_id: ${{ steps.request.outputs.herb_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run unless this is a deliberate, first-attempt request for TEST
        id: request
        run: |
          set -euo pipefail
          if [ "$PROJECT_REF" != "vgjehmwcpavflbfhbbrp" ]; then echo "::error::TEST project only."; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/integration" ]; then
            echo "::error::Only a push to integration may start this run."; exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::A re-run is refused: every credit-spending run needs its own new request commit."; exit 1
          fi
          f=docs/release/live-run-request.json
          jq -e '
            .target == "TEST vgjehmwcpavflbfhbbrp"
            and .authorized_by == "owner"
            and .enforcement == "off"
            and (.max_provider_calls | type == "number" and . <= 2)
            and (.request_id | type == "string" and test("^[a-z0-9-]{6,60}$"))
            and (.herb_id | type == "string" and test("^[a-z0-9-]{3,60}$"))
            and (.expires_at | type == "string" and (fromdateiso8601 > now))
          ' "$f" > /dev/null || { echo "::error::$f does not carry a valid, unexpired, TEST-only authorisation."; exit 1; }
          echo "herb_id=$(jq -r .herb_id "$f")" >> "$GITHUB_OUTPUT"
          echo "Request $(jq -r .request_id "$f") accepted: TEST only, enforcement off, at most 2 provider calls."

      - name: Verify every prerequisite (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TEST_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
        run: python3 scripts/live_run.py preflight

  live:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the photograph and the blank image
        env:
          HERB_ID: ${{ needs.preflight.outputs.herb_id }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          p = 'public/cards/' + os.environ['HERB_ID'] + '.webp'
          im = Image.open(p).convert('RGB'); w, h = im.size
          im.crop((int(w*.12), int(h*.11), int(w*.88), int(h*.50))).resize((900, int(900*(h*.39)/(w*.76)))).save('photo.jpg', quality=88)
          Image.new('RGB', (640, 640), (118, 124, 131)).save('blank.jpg', quality=88)
          PY

      - name: Create two confirmed disposable accounts and one aged receipt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TEST_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
        run: python3 scripts/live_run.py provision

      - name: Run the live camera-to-collection suite
        # No Supabase credential of any kind is in this step's environment: the suite signs in as the two ordinary players.
        env:
          HERB_ID: ${{ needs.preflight.outputs.herb_id }}
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="https://$PROJECT_REF.supabase.co"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$E2E_ANON_KEY"
          export E2E_PHOTO="$GITHUB_WORKSPACE/photo.jpg"
          export E2E_NONPLANT_PHOTO="$GITHUB_WORKSPACE/blank.jpg"
          export E2E_HERB_ID="$HERB_ID"
          export E2E_ENFORCEMENT=off
          export E2E_EVIDENCE_FILE="$RUNNER_TEMP/evidence.json"
          npx vitest run --config vitest.e2e.config.ts e2e/capture-flow.e2e.test.ts \
            --reporter=verbose --reporter=json --outputFile.json="$RUNNER_TEMP/results.json"

      - name: Summarise (PASS/FAIL per test and the evidence)
        if: always()
        run: python3 scripts/live_run.py summary

      - name: Delete only the accounts this run created
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/live_run.py cleanup
