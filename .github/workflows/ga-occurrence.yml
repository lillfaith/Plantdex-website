name: Georgia occurrence research

# Asks GBIF what is recorded in Georgia for each species in the printed deck.
#
# Read-only in every sense: it queries one public, keyless API, writes no database, reads no
# secret, contacts no identification provider and spends nothing. It runs here because
# api.gbif.org is blocked from the sandbox this repository is edited in — measured, not
# assumed (see scripts/resolve_taxa.py, which recorded the 403).
#
# IT DECIDES NOTHING. The output is a table and a JSON artifact carrying GBIF's counts and a
# PROPOSED classification under a stated rule. A human reads it and decides what goes on a
# quest board. Nothing here sets medicinal eligibility, which no pipeline may do.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Survey at most N species (blank = all 36)
        required: false
        type: string

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The classification rule and the deck parsing, checked before anything is classified
      # under them.
      - name: Self-test the rule
        run: python3 scripts/ga_occurrence.py --self-test

      - name: Survey
        run: |
          python3 scripts/ga_occurrence.py \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            --out build/georgia-occurrence.json

      - uses: actions/upload-artifact@v4
        with:
          name: georgia-occurrence
          path: build/georgia-occurrence.json
          retention-days: 90
