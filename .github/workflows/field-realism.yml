name: Identify real photographs

# Puts several genuine photographs of one species through the deployed identifier and prints
# what the provider called each of them.
#
# The 45-card survey used studio card art, and card art is not evidence about field
# photographs — that gap is exactly where "a violet reports as not one of the 45 cards" and
# "broadleaf dock will not identify" both came from. This closes it with real pictures taken
# by different people in different light.
#
# It also answers the one question that decides how much of a photograph the app should
# upload. Set `sizes` and each photograph is re-encoded at each setting and identified once
# per setting, so the candidates and scores can be compared directly — which is the only
# honest way to move `IDENTIFY_PROFILE` in src/lib/image-prepare.ts, because whether a
# smaller upload costs accuracy is a fact about PlantNet's model and not one this repository
# can reason its way to.
#
# Costs one identification per image PER SIZE. The anonymous allowance is 5 a day per IP and
# a runner gets a fresh one each job, so with three sizes the batch is one photograph; repeat
# across species as separate runs.
on:
  workflow_dispatch:
    inputs:
      category:
        description: Wikimedia Commons category, without the "Category:" prefix
        required: true
        default: Rumex obtusifolius
        type: string
      limit:
        description: How many photographs to try (limit x sizes must stay under 5)
        required: true
        default: '4'
        type: string
      sizes:
        description: 'Upload sizes to compare as edgeXquality, e.g. 1280x82,1024x75,800x75. Blank sends the photograph as downloaded.'
        required: false
        default: ''
        type: string
      project_ref:
        description: Which Supabase project to call
        required: true
        default: vygiamigomwlvnwkryyl
        type: choice
        options:
          - vygiamigomwlvnwkryyl # production
          - vgjehmwcpavflbfhbbrp # test

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the anon key, masked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail
          ANON=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | python3 -c "import json,sys; print(next(k['api_key'] for k in json.load(sys.stdin) if k['name']=='anon'))")
          echo "::add-mask::$ANON"
          echo "ANON_KEY=$ANON" >> "$GITHUB_ENV"

      - name: Identify each photograph
        env:
          CATEGORY: ${{ inputs.category }}
          LIMIT: ${{ inputs.limit }}
          SIZES: ${{ inputs.sizes }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          # Only needed for the size comparison; the plain path re-encodes nothing.
          if [ -n "$SIZES" ]; then
            python3 -m pip install --quiet --disable-pip-version-check pillow
          fi
          python3 scripts/identify_web_images.py
