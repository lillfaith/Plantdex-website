name: Prepare card photo candidates

# Scores CC0 photographs, segments the best with BiRefNet and renders finished card previews
# for a human to choose from. It SELECTS NOTHING: the top score is a ranking.
#
# Runs here so the segmentation model does not have to exist on anybody's laptop, and so the
# same model version produces every card. The weights are cached between runs -- the model is
# ~45MB and downloading it per run would dominate the job.
on:
  workflow_dispatch:
    inputs:
      species:
        description: Species key, as the directory under evidence/photos/
        required: true
        default: matricaria_chamomilla
        type: string
      top:
        description: How many finished previews to produce
        required: true
        default: '3'
        type: string
      discard_pool:
        description: Delete the unselected source pool after retention (destructive)
        required: false
        default: 'false'
        type: string
  # NO PUSH TRIGGER. This workflow segments, writes and (when authorized) deletes, and it
  # used to run on pushes to its own path -- so editing the workflow ran it, which is how a
  # retention step shipped and deleted a species' pool in the same push. A job with side
  # effects is started by a person, deliberately, with inputs.

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cached by model name, so a change of PLANTDEX_SEGMENT_MODEL fetches the new weights
      # rather than silently reusing the old ones under a stale key.
      - uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-${{ env.PLANTDEX_SEGMENT_MODEL || 'birefnet-general-lite' }}-v1

      - name: Install
        run: pip install --quiet rembg onnxruntime opencv-python-headless pillow numpy pymupdf

      - name: Self-test
        run: |
          python3 scripts/segment_plant.py --self-test
          python3 scripts/photo_pipeline.py --self-test
          python3 scripts/analyze_card_photos.py --self-test

      - name: Build candidates
        run: |
          python3 scripts/photo_pipeline.py \
            --species "${{ inputs.species || 'matricaria_chamomilla' }}" \
            --top "${{ inputs.top || '3' }}"

      # THE EXTERNAL STORE IS THE DESTINATION; THE COMMIT BELOW IS AN INTERIM FALLBACK.
      # Committing originals keeps CI durable and recreates the growth it was meant to
      # solve -- 8 MB a species in flight is 16 GB of git at 2,000, and git keeps every
      # version forever. So when a backend is configured the bytes go there and only the
      # index comes back; with no backend configured the step says so and the fallback
      # carries the pilot. It does NOT fail the job: losing the originals is worse than
      # committing them.
      - name: Upload the shortlisted assets to the durable store
        env:
          PLANTDEX_ASSET_ENDPOINT: ${{ secrets.PLANTDEX_ASSET_ENDPOINT }}
          PLANTDEX_ASSET_BUCKET: ${{ secrets.PLANTDEX_ASSET_BUCKET }}
          PLANTDEX_ASSET_KEY_ID: ${{ secrets.PLANTDEX_ASSET_KEY_ID }}
          PLANTDEX_ASSET_SECRET: ${{ secrets.PLANTDEX_ASSET_SECRET }}
          PLANTDEX_DROPBOX_TOKEN: ${{ secrets.PLANTDEX_DROPBOX_TOKEN }}
        run: |
          SP="${{ inputs.species || 'matricaria_chamomilla' }}"
          if [ -n "$PLANTDEX_ASSET_KEY_ID" ]; then
            pip install --quiet boto3
            python3 scripts/asset_store.py --species "$SP" --put --backend r2
          elif [ -n "$PLANTDEX_DROPBOX_TOKEN" ]; then
            python3 scripts/asset_store.py --species "$SP" --put --backend dropbox
          else
            echo "::error::No durable asset backend is configured, so this job has nowhere"
            echo "::error::to put the shortlisted originals. It FAILS CLOSED rather than"
            echo "::error::committing image binaries to git: that fallback kept CI durable"
            echo "::error::by recreating the repository growth the store exists to end."
            echo "::error::Set PLANTDEX_ASSET_ENDPOINT, _BUCKET, _KEY_ID and _SECRET."
            exit 1
          fi

      # DURABLE BEFORE THE RUNNER DIES, NOT AFTER. The shortlisted originals are the one
      # artefact that cannot be regenerated from anything else in the tree: the cutout and
      # the card are derived from them, the 96-photo pool is thrown away at the end of this
      # job, and a runner's disk does not survive it. So retention runs HERE -- it hashes
      # every shortlisted original, records the hash in the manifest, and refuses to delete
      # anything if one is missing -- and the commit below carries evidence/photos as well
      # as evidence/candidates. A retry or a later session finds the three originals, their
      # provenance and their hashes already in the repository.
      # RETENTION REPORTS; IT DOES NOT DELETE UNLESS ASKED. This step ran with --apply and
      # a push to this workflow file re-triggered the job, so CI deleted a pool the owner
      # had explicitly asked to leave alone -- 93 of chamomile's 96 originals, restored
      # from history afterwards. A destructive default inside a workflow that self-triggers
      # on its own path is a loaded gun pointed at the repository; deletion is now an
      # explicit input that defaults to false.
      - name: Preserve the shortlisted originals and their provenance
        run: |
          SP="${{ inputs.species || 'matricaria_chamomilla' }}"
          if [ "${{ inputs.discard_pool }}" = "true" ]; then
            python3 scripts/retain_assets.py --species "$SP" --apply \
              --authorize "DELETE $SP"
          else
            python3 scripts/retain_assets.py --species "$SP"
          fi

      - name: Verify every shortlisted original survived before committing
        run: |
          python3 - <<'EOF'
          import json, hashlib, pathlib, sys
          sp = "${{ inputs.species || 'matricaria_chamomilla' }}"
          cand = json.loads(pathlib.Path(f"evidence/candidates/{sp}/candidates.json").read_text())
          mf = pathlib.Path(f"evidence/photos/{sp}/photos.json")
          prov = {str(e["photo_id"]): e for e in json.loads(mf.read_text())["photos"]}
          bad = []
          for row in cand.get("selected", []):
              pid = str(row["photo_id"])
              e = prov.get(pid)
              f = mf.parent / (e or {}).get("file", "")
              if not e:
                  bad.append(f"{pid}: no provenance entry")
              elif not f.exists():
                  bad.append(f"{pid}: original missing from disk")
              elif e.get("sha256") != hashlib.sha256(f.read_bytes()).hexdigest():
                  bad.append(f"{pid}: hash does not match the manifest")
          for b in bad:
              print(f"::error::{b}")
          print(f"{len(cand.get('selected', []))} shortlisted original(s) checked")
          sys.exit(1 if bad else 0)
          EOF

      # PUSH AFTER REBASING, AND RETRY. Run 7 of this workflow did all the work and then
      # threw it away: the branch had moved on while BiRefNet was segmenting, so the push
      # was a non-fast-forward and the previews were lost with it. Two runs of this workflow
      # on one branch is the ordinary case, not the exception -- one per species.
      - name: Commit the previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # TEXT ONLY. evidence/photos is deliberately absent: the binaries live in R2 and
          # evidence/assets.json is how they are found. Adding the directory here is what
          # the fail-closed step above exists to prevent.
          git add evidence/candidates evidence/assets.json
          # NOT `git diff --staged --quiet && exit 0`: the step runs under `bash -e`, the
          # diff returns 1 when there IS something to commit, and a failing `&&` chain as a
          # statement is exactly what -e kills the job for.
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Photo candidates for review (nothing selected, nothing published)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "push rejected; the branch moved. retrying in $((i * 5))s"
            sleep $((i * 5))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
