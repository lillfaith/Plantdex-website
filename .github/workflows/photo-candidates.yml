name: Prepare card photo candidates

# Scores CC0 photographs, segments the best with BiRefNet and renders finished card previews
# for a human to choose from. It SELECTS NOTHING: the top score is a ranking.
#
# Runs here so the segmentation model does not have to exist on anybody's laptop, and so the
# same model version produces every card. The weights are cached between runs -- the model is
# ~45MB and downloading it per run would dominate the job.
on:
  workflow_dispatch:
    inputs:
      species:
        description: Species key, as the directory under evidence/photos/
        required: true
        default: matricaria_chamomilla
        type: string
      top:
        description: How many finished previews to produce
        required: true
        default: '3'
        type: string
  push:
    branches: [claude/botanical-catalog-stage-1]
    paths:
      - scripts/segment_plant.py
      - scripts/photo_pipeline.py
      - .github/workflows/photo-candidates.yml

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cached by model name, so a change of PLANTDEX_SEGMENT_MODEL fetches the new weights
      # rather than silently reusing the old ones under a stale key.
      - uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-${{ env.PLANTDEX_SEGMENT_MODEL || 'birefnet-general-lite' }}-v1

      - name: Install
        run: pip install --quiet rembg onnxruntime opencv-python-headless pillow numpy pymupdf

      - name: Self-test
        run: |
          python3 scripts/segment_plant.py --self-test
          python3 scripts/photo_pipeline.py --self-test
          python3 scripts/analyze_card_photos.py --self-test

      - name: Build candidates
        run: |
          python3 scripts/photo_pipeline.py \
            --species "${{ inputs.species || 'matricaria_chamomilla' }}" \
            --top "${{ inputs.top || '3' }}"

      - name: Commit the previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/candidates
          git diff --staged --quiet || git commit -m "Photo candidates for review (nothing selected, nothing published)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
