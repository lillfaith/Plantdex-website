name: Live camera-to-collection flow (TEST project only)

# Runs e2e/capture-flow.e2e.test.ts against the TEST Supabase project and nothing else: a signed-in player opens a capture
# session, ONE photograph goes through the DEPLOYED identify-plant function and its real provider, a receipt comes back, the
# player claims it, a fresh sign-in reads the collection back, and the replay / reuse / cross-account / direct-API attacks
# are made. No backend service is mocked: the only stand-in is the camera, a real species photograph cropped from the
# deck's own card art, sent down the same request path the app uses.
#
# SPENDS ONE PROVIDER IDENTIFICATION from the project's daily allowance per run (the replay spends none).
#
# THIS JOB HOLDS NO SECRET. The anon key is the repository VARIABLE TEST_SUPABASE_ANON_KEY (public by design); a step refuses a
# secret/service-role key or one from another project. The project ref is a literal with no input and a guard step fails if it
# is ever anything but the test project. DISPATCHED BY THE OWNER; agents never dispatch it. It does not deploy, migrate or
# change a flag. Run it only after 0016 is applied to TEST and identify-plant is redeployed (docs/release/v1-test-deployment.md).
on:
  workflow_dispatch:
    inputs:
      herb_id:
        description: Which deck card's photograph to submit
        required: true
        default: taraxacum-officinale
        type: string
      enforcement:
        description: "off for the first run. Choose on ONLY after the owner has switched enforcement on in TEST."
        required: true
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'

concurrency:
  group: live-capture-flow
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: vgjehmwcpavflbfhbbrp

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refuse to run against anything but the test project
        run: |
          set -euo pipefail
          if [ "$PROJECT_REF" != "vgjehmwcpavflbfhbbrp" ]; then
            echo "::error::This workflow is for the TEST project only."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the photograph (real species photo cropped from the deck's own card art)
        env:
          HERB_ID: ${{ inputs.herb_id }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 -c "import os;from PIL import Image;p='public/cards/'+os.environ['HERB_ID']+'.webp';im=Image.open(p).convert('RGB');w,h=im.size;im.crop((int(w*.12),int(h*.11),int(w*.88),int(h*.50))).resize((900,int(900*(h*.39)/(w*.76)))).save('photo.jpg',quality=88)"

      - name: Run the live camera-to-collection checks
        env:
          # A repository VARIABLE, not a secret: the anon key is public by design (it ships in every client
          # bundle; Row Level Security is the boundary). This job therefore holds NO secret at all.
          TEST_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TEST_ANON_KEY" ]; then
            echo "::error::Repository variable TEST_SUPABASE_ANON_KEY is not set (Settings > Secrets and variables > Actions > Variables). It is the TEST project's public anon key."
            exit 1
          fi
          # Two key formats exist and either is public by design: the legacy JWT anon key (eyJ...), and the newer
          # publishable key (sb_publishable_...), which is NOT a JWT and cannot be decoded. A secret or service-role
          # key is refused outright. Whatever the format, the key must WORK against the TEST project's own auth
          # endpoint (a key from any other project is rejected there), so format never decides the project.
          case "$TEST_ANON_KEY" in
            sb_secret_*) echo "::error::TEST_SUPABASE_ANON_KEY holds a SECRET key. Use the public anon or publishable key. Refusing to run."; exit 1 ;;
            sb_publishable_*) echo "Key format: publishable." ;;
            eyJ*)
              python3 - <<'PY'
          import base64, json, os, sys
          key = os.environ["TEST_ANON_KEY"]
          try:
              seg = key.split(".")[1]
              payload = json.loads(base64.urlsafe_b64decode(seg + "=" * (-len(seg) % 4)))
          except Exception:
              sys.exit("::error::TEST_SUPABASE_ANON_KEY looks like a JWT but cannot be read.")
          if payload.get("role") != "anon":
              sys.exit("::error::The JWT key is not role anon (a service-role key must never be used here). Refusing to run.")
          if payload.get("ref") not in (None, "vgjehmwcpavflbfhbbrp"):
              sys.exit("::error::The JWT key names another project. Refusing to run.")
          print("Key format: legacy JWT anon key.")
          PY
              ;;
            *) echo "::error::TEST_SUPABASE_ANON_KEY is neither a publishable key nor a JWT anon key."; exit 1 ;;
          esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $TEST_ANON_KEY" \
            "https://$PROJECT_REF.supabase.co/auth/v1/settings")
          if [ "$code" != "200" ]; then
            echo "::error::The key was not accepted by the TEST project (HTTP $code). It belongs to another project or is wrong. Refusing to run."
            exit 1
          fi
          echo "The TEST project accepts this key."
          export NEXT_PUBLIC_SUPABASE_URL="https://$PROJECT_REF.supabase.co"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$TEST_ANON_KEY"
          export E2E_PHOTO="$GITHUB_WORKSPACE/photo.jpg"
          export E2E_HERB_ID="${{ inputs.herb_id }}"
          export E2E_ENFORCEMENT="${{ inputs.enforcement }}"
          set +e
          npx vitest run --config vitest.e2e.config.ts e2e/capture-flow.e2e.test.ts --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/live.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ] && grep -q "Email not confirmed" "$RUNNER_TEMP/live.log"; then
            echo "::error::No test ran: the TEST project requires email confirmation, so the suite's disposable accounts cannot sign in. In the TEST project's dashboard turn OFF Authentication > Sign In / Providers > Email > Confirm email, then re-run. (The suite already documents this requirement.)"
          fi
          exit "$code"
