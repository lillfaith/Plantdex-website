name: Candidate package (unedited originals with verification)

# PRIVATE DEVELOPMENT TOOL. Packages named candidate photographs, verified (own-photo CC0, taxon, highest size), unedited, with a manifest.
# STARTED BY PUSHING evidence/candidate-packages/request.json. Edits nothing, deploys nothing.
on:
  push:
    branches: [claude/production-system-v1]
    paths:
      - evidence/candidate-packages/request.json

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow numpy opencv-python-headless pymupdf
      - id: fetch
        continue-on-error: true
        run: python3 scripts/production/fetch_candidates.py --request evidence/candidate-packages/request.json --out export
      - uses: actions/upload-artifact@v4
        with:
          name: plantdex-candidates
          path: export
          compression-level: 0
          retention-days: 30
      - name: Commit the manifest (small JSON/CSV only) so licence provenance is traceable in the repo
        if: always()
        run: |
          D=evidence/candidate-packages/manifests/$(python3 -c "import json;print(json.load(open('evidence/candidate-packages/request.json'))['batch'])")
          mkdir -p "$D" && cp export/manifest.json export/manifest.csv export/REPORT.txt "$D"/
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add evidence/candidate-packages/manifests; git commit -m "Candidate package manifest (provenance)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true; git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*5)); done; exit 1
      - name: Fail if any photograph failed a check
        if: steps.fetch.outcome != 'success'
        run: cat export/REPORT.txt; exit 1
