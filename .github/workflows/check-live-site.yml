name: Check the live site

# Fetches the DEPLOYED pages and asserts what they contain.
#
# The deploy workflow proves a build succeeded and an artifact was uploaded. It cannot prove
# that /profile is reachable, or that the stylesheet Pages is serving is the one this build
# produced — and a stale stylesheet renders a correct page unstyled while every status code
# stays 200. That is the gap this closes.
#
# It runs here because the sandbox this repo is developed in cannot reach github.io: the
# proxy refuses the tunnel outright, so a live check is not something that can be run from
# a session and reported honestly. Read-only, no secrets, safe to run any time.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Base URL of the deployed site (blank derives it from SITE_DOMAIN)
        required: false
        # DELIBERATELY BLANK, AND THAT IS A BUG FIX.
        #
        # This defaulted to https://lillfaith.github.io/Plantdex-website, which made the
        # `SITE_DOMAIN` derivation below DEAD CODE on every manual run: `inputs.site_url`
        # was always that literal, always truthy, so the `||` chain short-circuited before
        # it ever looked at the variable. Every dispatch silently checked the old project
        # URL — where the site no longer lives, since SITE_DOMAIN drops the base path — and
        # reported the stylesheets and the Supabase ref as missing. Three loud, specific,
        # entirely false failures, and the derivation written to prevent exactly that was
        # never once consulted.
        #
        # It cost a wrong diagnosis too: the fallback was read as evidence that
        # `vars.SITE_DOMAIN` resolves empty here. It does not, and never did — the build's
        # own output proves it, since `next.config.ts` only drops the base path when
        # SITE_DOMAIN is non-empty and the live site has no base path. A default that
        # short-circuits a fallback chain hides the chain rather than seeding it.
        default: ''
        type: string
  # After every Pages deploy, so a broken publish is reported rather than waiting to be
  # noticed. `completed` fires for failures too; the job skips those.
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      # THE CHECK HAS TO FOLLOW THE DOMAIN, OR IT GUARDS THE WRONG SITE.
      #
      # This URL used to be a literal. On the day a custom domain goes live that literal
      # keeps passing — the old github.io address still answers — while the address people
      # actually visit could be entirely broken. A green check on a URL nobody uses is worse
      # than no check, because it is read as evidence.
      #
      # So it derives from the same `SITE_DOMAIN` variable that drives the base path and the
      # CNAME (see deploy.yml). Unset, it is exactly the literal it replaced. An explicit
      # `site_url` input still wins, which is how a one-off run checks somewhere else —
      # but it must DEFAULT TO BLANK, or it wins on every run and this chain is dead code.
      - name: Fetch every route and check what it contains
        env:
          SITE_URL: >-
            ${{ inputs.site_url
                || (vars.SITE_DOMAIN != '' && format('https://{0}', vars.SITE_DOMAIN))
                || 'https://lillfaith.github.io/Plantdex-website' }}
        run: python3 scripts/check_live_site.py
