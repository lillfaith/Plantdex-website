name: Verify Plant ID end to end

# Sends a real photograph to a project's `identify-plant` function and reports what came
# back. This is the one part of Plant ID that cannot be proved from the repository: the
# unit tests check matching, safety wording and rate-limit shape, but only a live call
# proves the provider key is present, valid, and answering.
#
# WHY IT RUNS HERE. Calling the function needs the project's anon key, and reading the live
# site to find one is not possible from a sandboxed session. The Management API will hand a
# project's keys to the access token this repo already holds — so the runner can fetch the
# key, use it, and never print it. Nothing new is stored and no key is added to the repo.
#
# IT SPENDS ONE IDENTIFICATION from that project's daily allowance, and writes one
# `scan_quota` row. That is the cost of knowing rather than assuming.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Which Supabase project to test against
        required: true
        default: vygiamigomwlvnwkryyl
        type: choice
        options:
          - vygiamigomwlvnwkryyl # production — real players
          - vgjehmwcpavflbfhbbrp # test
      herb_ids:
        description: Comma-separated card ids to photograph and identify
        required: true
        default: taraxacum-officinale,urtica-dioica,achillea-millefolium,plantago-major,trifolium-pratense,quercus-spp
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the token is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi

      - name: Identify each species and report what the provider calls it
        # ONE CALL PER CARD. Testing a single species is how the dandelion synonym gap got
        # through: the provider's accepted name differed from the card's, every candidate
        # resolved to "related species", and the commonest plant in the deck reported "not
        # in this collection". The only way to know which other cards have that problem is
        # to ask the provider what it calls them.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
          HERB_IDS: ${{ inputs.herb_ids }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow

          ANON=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | python3 -c "import json,sys; print(next(k['api_key'] for k in json.load(sys.stdin) if k['name']=='anon'))")
          echo "::add-mask::$ANON"
          if [ -z "$ANON" ]; then echo "::error::Could not read the anon key."; exit 1; fi

          fail=0
          for id in $(echo "$HERB_IDS" | tr ',' ' '); do
            src="public/cards/$id.webp"
            if [ ! -f "$src" ]; then echo "::warning::no card art for $id"; continue; fi

            # The card fronts embed real species photographs; crop to the photo panel so the
            # provider is not asked to identify the card's typography.
            python3 -c "from PIL import Image;im=Image.open('$src').convert('RGB');w,h=im.size;im.crop((int(w*.12),int(h*.11),int(w*.88),int(h*.50))).resize((900,int(900*(h*.39)/(w*.76)))).save('/tmp/s.jpg',quality=88)"

            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 90 \
              -X POST "https://$PROJECT_REF.supabase.co/functions/v1/identify-plant" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -F "image=@/tmp/s.jpg")

            echo "──────────────────────────────────────────────"
            echo "$id  ->  HTTP $code"
            if grep -q '"code":"unconfigured"' /tmp/out.json; then
              echo "::error::PLANTNET_API_KEY is not set on $PROJECT_REF."
              exit 1
            fi
            if [ "$code" = "429" ]; then echo "  rate limited — quota reached, stopping"; break; fi
            if [ "$code" != "200" ]; then echo "::warning::unexpected status"; cat /tmp/out.json; fail=1; continue; fi
            python3 -c "import json;d=json.load(open('/tmp/out.json'));c=d.get('candidates',[]);print(f'  candidates: {len(c)}');[print(f\"    {x['scientificName']:<38} {x['score']:.3f}\") for x in c];print('  remaining today:', d.get('remaining'))"
          done
          echo "──────────────────────────────────────────────"
          exit $fail
