name: Verify Plant ID end to end

# Sends a real photograph to a project's `identify-plant` function and reports what came
# back. This is the one part of Plant ID that cannot be proved from the repository: the
# unit tests check matching, safety wording and rate-limit shape, but only a live call
# proves the provider key is present, valid, and answering.
#
# WHY IT RUNS HERE. Calling the function needs the project's anon key, and reading the live
# site to find one is not possible from a sandboxed session. The Management API will hand a
# project's keys to the access token this repo already holds — so the runner can fetch the
# key, use it, and never print it. Nothing new is stored and no key is added to the repo.
#
# IT SPENDS ONE IDENTIFICATION from that project's daily allowance, and writes one
# `scan_quota` row. That is the cost of knowing rather than assuming.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Which Supabase project to test against
        required: true
        default: vygiamigomwlvnwkryyl
        type: choice
        options:
          - vygiamigomwlvnwkryyl # production — real players
          - vgjehmwcpavflbfhbbrp # test

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the token is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi

      - name: Build a real plant photograph to send
        # The card fronts embed actual photographs of each species, so one of them is a
        # genuine test subject rather than a synthetic image. Cropped to the photo panel so
        # the card's typography and border are not what the provider is asked to identify.
        # ImageMagick ships on ubuntu-latest; no fixture needs committing.
        run: |
          set -euo pipefail
          convert public/cards/taraxacum-officinale.webp \
            -crop 70%x38%+120+130 +repage -resize 900x -quality 88 /tmp/subject.jpg
          ls -l /tmp/subject.jpg
          file /tmp/subject.jpg

      - name: Identify it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -euo pipefail

          # The anon key is public — it ships in the site's own JavaScript — but there is no
          # reason to print it, so it goes straight into a variable and is masked as well.
          ANON=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | python3 -c "import json,sys; print(next(k['api_key'] for k in json.load(sys.stdin) if k['name']=='anon'))")
          echo "::add-mask::$ANON"
          if [ -z "$ANON" ]; then echo "::error::Could not read the anon key."; exit 1; fi

          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 90 \
            -X POST "https://$PROJECT_REF.supabase.co/functions/v1/identify-plant" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -F "image=@/tmp/subject.jpg")

          echo "HTTP $code"
          echo "Response:"
          # Safe to print: names, scores and counters only — the function returns nothing
          # about the caller and nothing about the provider key.
          python3 -m json.tool < /tmp/out.json || cat /tmp/out.json
          echo

          # A 429 is a PASS for the purposes of this check: it proves the function ran, the
          # key was accepted and the quota logic fired. Only unconfigured or a provider
          # failure is a real problem.
          if grep -q '"code":"unconfigured"' /tmp/out.json; then
            echo "::error::PLANTNET_API_KEY is not set on $PROJECT_REF. Set it with:"
            echo "::error::  supabase secrets set PLANTNET_API_KEY=... --project-ref $PROJECT_REF"
            exit 1
          fi
          if [ "$code" = "502" ]; then
            echo "::error::The provider could not be reached, or rejected the key."
            exit 1
          fi
          if [ "$code" != "200" ] && [ "$code" != "429" ]; then
            echo "::error::Unexpected status $code."
            exit 1
          fi

          if [ "$code" = "200" ]; then
            # One-liner, not a heredoc: a heredoc inside a YAML block scalar loses its
            # terminator to the dedent. Already fixed once in run-migration.yml.
            python3 -c "import json;d=json.load(open('/tmp/out.json'));c=d.get('candidates',[]);print(f'candidates: {len(c)}');[print(f\"  {x['scientificName']:<40} {x['score']:.3f}\") for x in c];raise SystemExit('no candidates and no providerFoundNothing flag') if not c and not d.get('providerFoundNothing') else print('Plant ID is answering.')"
          fi
