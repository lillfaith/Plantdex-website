name: Verify Plant ID end to end

# Sends a real photograph to a project's `identify-plant` function and reports what came
# back. This is the one part of Plant ID that cannot be proved from the repository: the
# unit tests check matching, safety wording and rate-limit shape, but only a live call
# proves the provider key is present, valid, and answering.
#
# WHY IT RUNS HERE. Calling the function needs the project's anon key, and reading the live
# site to find one is not possible from a sandboxed session. The Management API will hand a
# project's keys to the access token this repo already holds — so the runner can fetch the
# key, use it, and never print it. Nothing new is stored and no key is added to the repo.
#
# IT SPENDS ONE IDENTIFICATION from that project's daily allowance, and writes one
# `scan_quota` row. That is the cost of knowing rather than assuming.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Which Supabase project to test against
        required: true
        default: vygiamigomwlvnwkryyl
        type: choice
        options:
          - vygiamigomwlvnwkryyl # production — real players
          - vgjehmwcpavflbfhbbrp # test
      herb_ids:
        description: Comma-separated card ids to photograph and identify
        required: true
        default: taraxacum-officinale,urtica-dioica,achillea-millefolium,plantago-major,trifolium-pratense,quercus-spp
        type: string
      site_url:
        description: Deployed site to check the player-facing path against (blank to skip)
        required: false
        default: https://lillfaith.github.io/Plantdex-website
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the token is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi

      - name: Check the live site can reach this project
        # THE GAP EVERY OTHER CHECK LEAVES. A green function proves nothing about the
        # browser: the client only reaches it if the Pages build was handed
        # NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY as repo VARIABLES.
        # Unset, the build still succeeds and every player is told Plant ID "is not
        # available here yet" — invisible from the repo, invisible from CI, visible only in
        # the served bundle. So this reads the served bundle.
        #
        # ONLY AGAINST THE PROJECT THE LIVE SITE IS SUPPOSED TO POINT AT. The served bundle
        # carries ONE project, so asking whether it reaches the TEST one is a question with a
        # guaranteed answer and no meaning — and it aborts the run before the identification
        # that was the point of dispatching it. That happened: a test-project run died here
        # reporting something true only of production, and spent nothing verifying plant.id.
        # A check that cannot pass for the run you asked for should not gate it.
        if: inputs.site_url != '' && inputs.project_ref == 'vygiamigomwlvnwkryyl'
        # Through env rather than interpolated into the command: a dispatch input spliced
        # straight into a shell line is a command-injection shape, and it costs nothing to
        # not write one.
        env:
          SITE_URL: ${{ inputs.site_url }}
          PROJECT_REF: ${{ inputs.project_ref }}
        run: python3 scripts/check_live_scan.py "$SITE_URL" "$PROJECT_REF"

      - name: Identify each species and report what the provider calls it
        # ONE CALL PER CARD. Testing a single species is how the dandelion synonym gap got
        # through: the provider's accepted name differed from the card's, every candidate
        # resolved to "related species", and the commonest plant in the deck reported "not
        # in this collection". The only way to know which other cards have that problem is
        # to ask the provider what it calls them.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.project_ref }}
          HERB_IDS: ${{ inputs.herb_ids }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow

          ANON=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | python3 -c "import json,sys; print(next(k['api_key'] for k in json.load(sys.stdin) if k['name']=='anon'))")
          echo "::add-mask::$ANON"
          if [ -z "$ANON" ]; then echo "::error::Could not read the anon key."; exit 1; fi

          fail=0
          for id in $(echo "$HERB_IDS" | tr ',' ' '); do
            src="public/cards/$id.webp"
            if [ ! -f "$src" ]; then echo "::warning::no card art for $id"; continue; fi

            # TWO photographs, because the endpoint now requires two and refuses below it.
            # This posted a single `image` field and would have started answering
            # `400 tooFewImages` the moment the multi-photo function deployed — the one check
            # that proves a provider key works live, broken by the deploy it exists to verify.
            # `scripts/crop_card_photo.py` carries the cropping and why the pair is honest.
            python3 scripts/crop_card_photo.py "$src" /tmp/s1.jpg /tmp/s2.jpg

            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 90 \
              -X POST "https://$PROJECT_REF.supabase.co/functions/v1/identify-plant" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
              -F "image=@/tmp/s1.jpg" -F "organ=habit" \
              -F "image=@/tmp/s2.jpg" -F "organ=leaf")

            echo "──────────────────────────────────────────────"
            echo "$id  ->  HTTP $code"
            if grep -q '"code":"unconfigured"' /tmp/out.json; then
              # Provider-neutral, because the deployment chooses which provider answers.
              # `unconfigured` means "the key for the SELECTED provider is absent, or the
              # provider refused it" — naming PLANTNET_API_KEY here would send somebody
              # hunting the wrong secret on a plant.id deployment, which is precisely the
              # confusion the function's own comment records having caused once.
              echo "::error::The selected provider's key is missing or was refused on $PROJECT_REF."
              echo "  Check PLANT_IDENTIFICATION_PROVIDER and the key secret that matches it."
              cat /tmp/out.json
              exit 1
            fi
            if grep -q '"code":"tooFewImages"' /tmp/out.json; then
              echo "::error::identify-plant wants more photographs than this workflow sent."
              exit 1
            fi
            if [ "$code" = "429" ]; then echo "  rate limited — quota reached, stopping"; break; fi
            if [ "$code" != "200" ]; then echo "::warning::unexpected status"; cat /tmp/out.json; fail=1; continue; fi
            # `provider` and `observationId` are what make this readable once two providers
            # exist: WHICH one answered, and the id to join an `identification_comparisons`
            # row on afterwards. Without them a green run says nothing about the provider.
            python3 -c "import json;d=json.load(open('/tmp/out.json'));c=d.get('candidates',[]);print('  provider:', d.get('provider'), '| observation:', d.get('observationId'));print(f'  candidates: {len(c)}');[print(f\"    {x['scientificName']:<38} {x['score']:.3f}  {x.get('rank','')}\") for x in c];print('  remaining today:', d.get('remaining'))"
          done
          echo "──────────────────────────────────────────────"
          exit $fail
