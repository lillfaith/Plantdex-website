name: Verify Supabase live (TEST only)

# Runs `npm run verify:supabase`'s suite against the TEST project and nowhere else.
#
# WHERE THE CONFIGURATION COMES FROM. The repository holds no secret for the test URL or anon
# key, and the variables NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are the ones
# the Pages build uses, so they must never feed this job. The URL is built from the literal
# test ref below, and the anon key is read from the Management API with
# SUPABASE_TEST_ACCESS_TOKEN, the same way comparison-account.yml does. Nothing is typed in.
#
# FAIL CLOSED, THREE TIMES. (1) The ref is a literal with no input feeding it and is checked.
# (2) The URL handed to the suite is checked again in its own step, by string, before any test
# starts. (3) PLANTDEX_E2E_REQUIRED=1 makes e2e/guard.setup.ts throw on a missing URL or key,
# so a run can never go green by skipping every suite.
#
# The local script reads `.env.local` through `node --env-file`; there is no such file here,
# so vitest is called directly with the variables in the step's environment. The key is masked.
on:
  workflow_dispatch:
    inputs:
      files:
        description: Optional space-separated test files (blank = the whole live suite)
        required: false
        type: string

permissions:
  contents: read

env:
  PROJECT_REF: vgjehmwcpavflbfhbbrp
  PRODUCTION_REF: vygiamigomwlvnwkryyl

jobs:
  live:
    environment: supabase-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to run against anything but the test project
        run: |
          set -euo pipefail
          if [ "$PROJECT_REF" != "vgjehmwcpavflbfhbbrp" ] || [ "$PROJECT_REF" = "$PRODUCTION_REF" ]; then
            echo "::error::Hard-scoped to the TEST project (got '$PROJECT_REF')."
            exit 1
          fi
          echo "Scoped to TEST ($PROJECT_REF)."

      - name: Fail early if the test token is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_TEST_ACCESS_TOKEN is not set."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read the test project's anon key (public; masked)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEST_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ANON=$(curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          if [ -z "$ANON" ] || [ "$ANON" = "null" ]; then
            echo "::error::Could not read the anon key."
            exit 1
          fi
          echo "::add-mask::$ANON"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$PROJECT_REF.supabase.co" >> "$GITHUB_ENV"

      - name: Safeguard - the configured URL must be the test project
        # Checked on the value the suite will actually read, not on the literal it was built
        # from. Missing configuration fails; so does anything that is not the test ref.
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Live configuration is missing. Refusing to run."
            exit 1
          fi
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            *"$PRODUCTION_REF"*)
              echo "::error::The configured URL is the PRODUCTION project. Refusing."
              exit 1 ;;
            "https://vgjehmwcpavflbfhbbrp.supabase.co") echo "URL is the TEST project." ;;
            *)
              echo "::error::The configured URL is not the TEST project. Refusing."
              exit 1 ;;
          esac

      - name: Live suite
        env:
          PLANTDEX_E2E_REQUIRED: '1'
          # Only the fresh-mint registry tests sign a candidate. Empty if the repository does
          # not hold it; those tests then fail by name rather than the job leaking anything.
          SPECIES_ATTESTATION_SECRET: ${{ secrets.SPECIES_ATTESTATION_SECRET }}
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          npx vitest run --config vitest.e2e.config.ts $FILES --reporter=verbose
