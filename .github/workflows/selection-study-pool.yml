name: Selection study (full pool)

# PRIVATE RESEARCH TOOL. Re-screens each species' whole candidate pool with the real pipeline and locates the owner's
# hand picks in it. Changes no card, asset, weight or ranking. Deploys nothing.
# STARTED BY PUSHING evidence/selection-study/pool-request.json.
on:
  push:
    branches: [claude/production-system-v1]
    paths:
      - evidence/selection-study/pool-request.json

permissions:
  contents: write
  actions: read

env:
  PIPDEPS: pillow numpy opencv-python-headless rembg onnxruntime pymupdf

jobs:
  species:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet $PIPDEPS
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-birefnet-lite
      - name: Screen the pool and locate the owner's picks
        run: python3 scripts/production/selection_study_pool.py --request evidence/photo-fetch/request.json --index ${{ matrix.index }} --picks evidence/selection-study/picks --out out --limit 300
      - uses: actions/upload-artifact@v4
        with:
          name: pool-study-${{ matrix.index }}
          path: out
          retention-days: 14

  report:
    needs: species
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pool-study-*
          path: out
          merge-multiple: true
      - name: Commit the report (small files only)
        run: |
          mkdir -p evidence/selection-study/report-pool && cp -r out/. evidence/selection-study/report-pool/
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add evidence/selection-study/report-pool
          if git diff --staged --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Selection study (full pool): owner picks vs the whole screened pool (research only)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1
