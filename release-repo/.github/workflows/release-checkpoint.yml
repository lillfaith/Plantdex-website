name: Release checkpoint (read-only)

# STEP 0 of docs/release-runbook.md. Records what production looks like BEFORE anything is
# changed — the one step that cannot be done afterwards, because once a migration has run,
# "what did this look like before" is no longer a question anybody can answer.
#
# READ-ONLY, and the script is the guarantee: four GETs plus SELECTs through the Management
# API's query endpoint, with every statement listed in one block of `release_checkpoint.py`
# so a reviewer reads them as a set. It creates, alters and deletes nothing.
#
# IT PRINTS NO SECRET VALUE. The access token is sent in a header and never echoed; function
# SECRETS are a separate question answered by `check-function-secrets.yml`, which prints
# names and a yes/no.
#
# It defaults to PRODUCTION on purpose — unlike every other workflow here, reading production
# is the entire point of this one — and the script refuses any ref that is not one of the two
# known projects.
# PORTED INTO THE RELEASE REPOSITORY (docs/agent-workflow/release-repository.md). Runs ONLY here, only when the owner presses
# "Run workflow", and only against the PRODUCTION project: the job's environment is `supabase-production`, which allows branch
# `main` only and waits for the owner's approval. The Claude GitHub App is not installed on this repository. Test-project runs
# stay in the app repository under the `supabase-test` environment. The app's code is checked out at an owner-named commit that
# must be on the app's production branch.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA, on the app repository's production branch, to run from
        required: true
        type: string
      project_ref:
        description: Which Supabase project to record
        required: true
        default: vygiamigomwlvnwkryyl
        type: choice
        options:
          - vygiamigomwlvnwkryyl # production

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Check out the app at the chosen commit
        uses: actions/checkout@v4
        with:
          repository: lillfaith/Plantdex-website
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: The commit must be a full SHA that is on the app's production branch
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Give the full 40-character SHA."; exit 1; }
          git fetch --quiet origin claude/planning-session-61zwro
          git merge-base --is-ancestor "$SHA" FETCH_HEAD || { echo "::error::$SHA is not on the production branch."; exit 1; }
          { echo "### Running against"; git log -1 --format='`%h` %s' "$SHA"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail early if the token is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."; exit 1
          fi
      - name: Record the checkpoint
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/release_checkpoint.py
