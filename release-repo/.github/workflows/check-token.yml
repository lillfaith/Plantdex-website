name: Check the production Supabase token (read-only)

# RELEASE REPOSITORY ONLY. Proves the production credential works and says how far it reaches, WITHOUT changing anything: one
# GET of the project list, nothing else. It prints no token, no project list and no project name, only yes/no answers.
#
# It answers three questions:
#   1. Is the token accepted at all?  (HTTP status)
#   2. Can it see the PRODUCTION project?  (needed for deploys and migrations)
#   3. Can it ALSO see the TEST project?  (If so the token is not limited to one project, and "production-only" is a habit and
#      an approval gate rather than something Supabase enforces. Preferred answer: production only.)
# Runs in the `supabase-production` environment: branch `main` only, owner approval required.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Check the token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          PROD=vygiamigomwlvnwkryyl
          TEST=vgjehmwcpavflbfhbbrp
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set in the supabase-production environment."; exit 1
          fi
          code=$(curl -sS -o /tmp/projects.json -w '%{http_code}' https://api.supabase.com/v1/projects \
                 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "token accepted ......................... HTTP $code"
          [ "$code" = "200" ] || { echo "::error::The token was rejected (HTTP $code): expired, revoked, or malformed."; exit 1; }
          has_prod=no; has_test=no
          grep -q "\"$PROD\"" /tmp/projects.json && has_prod=yes
          grep -q "\"$TEST\"" /tmp/projects.json && has_test=yes
          echo "can see the production project ......... $has_prod"
          echo "can ALSO see the test project .......... $has_test"
          if [ "$has_prod" != "yes" ]; then
            echo "::error::The token cannot see the production project. It needs resource access to it."; exit 1
          fi
          if [ "$has_test" = "yes" ]; then
            echo "::warning::The token is not limited to production: it can reach the test project too. Works, but prefer a token whose resource access is production only."
          else
            echo "Token is limited to the production project."
          fi
          rm -f /tmp/projects.json
